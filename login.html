<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Teatro Don Bosco</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center px-4">
  <div class="bg-white shadow-xl rounded-2xl p-8 w-full max-w-md">
    <h2 class="text-2xl font-bold text-center mb-6">Login / Sign Up</h2>

    <form class="space-y-4">
      <input id="email" type="email" placeholder="Email" class="w-full border rounded-lg px-4 py-3">
      <input id="password" type="password" placeholder="Password" class="w-full border rounded-lg px-4 py-3">
      

      <button id="loginBtn" class="w-full bg-blue-900 text-white py-3 rounded-xl hover:bg-blue-700">
        Login
      </button>

      <button id="signupBtn" type="button" class="w-full border border-blue-900 text-blue-900 py-3 rounded-xl hover:bg-blue-50">
        Create Account
      </button>
    </form>

    <div class="mt-6 text-center">
      <a href="index.html" class="text-blue-900 hover:underline">Back to Event</a>
    </div>
  </div>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
