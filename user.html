<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen">

<!-- NAV -->
<nav class="flex justify-between items-center p-6 text-blue-900">
  <h1 class="text-2xl font-bold">🎭 Mis Reservas</h1>

  <div>
    <button onclick="goHome()" class="mr-4 bg-blue-500 text-white px-4 py-2 rounded-lg">
      Inicio
    </button>

    <button onclick="logout()" class="bg-red-400 text-white px-4 py-2 rounded-lg">
      Cerrar sesión
    </button>
  </div>
</nav>

<!-- CONTENIDO -->
<div class="max-w-3xl mx-auto mt-10 p-6 bg-white rounded-2xl shadow-lg">

  <h2 class="text-2xl font-semibold mb-6 text-center">
    Tus Reservas 🎟️
  </h2>

  <div id="reservations" class="space-y-4 text-center">
    <p>Cargando...</p>
  </div>

</div>

<script type="module">

import { db } from "./js/firebase.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// 🔐 USUARIO
const user = JSON.parse(localStorage.getItem("user"));

if (!user) {
  window.location.href = "index.html";
}

const container = document.getElementById("reservations");

// 🔥 CARGAR RESERVAS
async function loadReservations() {

  const querySnapshot = await getDocs(collection(db, "reservations"));

  let html = "";
  let found = false;

  querySnapshot.forEach(doc => {
    const data = doc.data();

    if (data.user === user.email) {
      found = true;

      html += `
        <div class="bg-blue-50 p-4 rounded-xl shadow">
          <p><strong>Adultos:</strong> ${data.adults.join(", ") || "Ninguno"}</p>
          <p><strong>Niños:</strong> ${data.children.join(", ") || "Ninguno"}</p>
          <p class="text-sm text-gray-500 mt-2">
            ${new Date(data.createdAt.seconds * 1000).toLocaleString()}
          </p>
        </div>
      `;
    }
  });

  if (!found) {
    html = "<p>No tienes reservas aún</p>";
  }

  container.innerHTML = html;
}

// BOTONES
window.logout = function() {
  localStorage.removeItem("user");
  window.location.href = "index.html";
};

window.goHome = function() {
  window.location.href = "home.html";
};

// INICIAR
loadReservations();

</script>

</body>
</html>
