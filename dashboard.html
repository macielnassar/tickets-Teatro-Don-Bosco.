<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-blue-100">

<h1 class="text-center text-2xl font-bold mt-6 text-blue-900">
My Tickets
</h1>

<div id="tickets" class="text-center mt-6"></div>

<script>
const tickets = JSON.parse(localStorage.getItem("myTickets")) || [];

const div = document.getElementById("tickets");

if (tickets.length === 0) {
  div.innerText = "No tickets yet";
} else {
  div.innerText = "Your seats: " + tickets.join(", ");
}
</script>

</body>
</html>
