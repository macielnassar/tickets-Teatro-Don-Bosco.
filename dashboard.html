<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Teatro Don Bosco</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen">
  <nav class="bg-blue-900 text-white p-4 flex justify-between items-center">
    <h1 class="text-xl font-bold">My Tickets</h1>
    <button id="logoutBtn" class="bg-white text-blue-900 px-4 py-2 rounded-lg">Logout</button>
  </nav>

  <main class="max-w-5xl mx-auto px-6 py-10">
    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-2xl font-bold mb-6">Purchased Tickets</h2>

      <div class="border rounded-xl p-4 bg-gray-50">
        <p class="font-semibold">Teatro Don Bosco</p>
        <p class="text-gray-600">Quantity: 2</p>
        <p class="text-gray-600">Purchase Date: April 9, 2026</p>
      </div>
    </div>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
