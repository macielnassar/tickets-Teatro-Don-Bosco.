<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seat Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    header {
      padding: 20px;
      text-align: center;
      background: #0b3c5d;
      color: white;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
      gap: 40px;
    }

    .seats-area {
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .screen {
      text-align: center;
      background: #ddd;
      padding: 10px;
      margin-bottom: 20px;
      border-radius: 6px;
      font-weight: bold;
    }

    .row {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }

    .seat {
      width: 28px;
      height: 28px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      background: #b0cde8;
      transition: 0.2s;
    }

    .seat.adult {
      background: #5dade2;
    }

    .seat.child {
      background: #82e0aa;
    }

    .seat.selected {
      background: #f1c40f;
    }

    .seat.occupied {
      background: #555;
      cursor: not-allowed;
    }

    .info {
      background: white;
      padding: 25px;
      border-radius: 12px;
      width: 280px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .info h3 {
      margin-top: 0;
    }

    select {
      width: 100%;
      padding: 10px;
      margin-bottom: 15px;
    }

    .summary {
      margin-top: 20px;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background: #0b3c5d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Select Your Seats</h1>
  <p>Choose adult or child tickets</p>
</header>

<div class="container">

  <div class="seats-area">
    <div class="screen">STAGE</div>
    <div id="seats-container"></div>
  </div>

  <div class="info">
    <h3>Ticket Type</h3>

    <select id="ticketType">
      <option value="adult">Adult - $20</option>
      <option value="child">Child - $12</option>
    </select>

    <div class="summary">
      Seats selected: <span id="count">0</span><br>
      Total price: $<span id="total">0</span>
    </div>

    <button id="confirm">Confirm Selection</button>
  </div>

</div>

<script src="js/seats.js"></script>
</body>
</html>
