<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Select Your Seats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", sans-serif;
      background: #f4f7fb;
      color: #1f2d3d;
    }

    header {
      background: #0b3c5d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    h2 {
      text-align: center;
      margin-bottom: 10px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
    }

    .seat {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
    }

    .adult { background: #0b3c5d; }
    .child { background: #6baed6; }
    .selected { outline: 3px solid #f7c948; }
    .occupied { background: #bbb; cursor: not-allowed; }

    .screen {
      background: #ccc;
      padding: 8px;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 4px;
      font-weight: bold;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      justify-items: center;
      margin-bottom: 30px;
    }

    .summary {
      text-align: center;
      font-size: 16px;
    }

    button {
      background: #0b3c5d;
      color: white;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 20px;
    }

    button:hover {
      background: #094063;
    }

    #confirmationModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
    }

    #confirmationModal div {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Seat Selection</h1>
  <p>Select your seats and confirm your purchase</p>
</header>

<main>

  <div class="legend">
    <span><div class="seat adult"></div> Adult — $10</span>
    <span><div class="seat child"></div> Child — $6</span>
    <span><div class="seat occupied"></div> Occupied</span>
  </div>

  <div class="screen">STAGE</div>

  <div class="seats" id="seats"></div>

  <div class="summary" id="summary">
    Selected seats: 0<br>
    Total: $0
  </div>

  <div style="text-align:center">
    <button id="confirm">Confirm Selection</button>
  </div>

</main>

<!-- CONFIRMATION MODAL -->
<div id="confirmationModal">
  <div>
    <h2>Purchase Successful 🎉</h2>
    <p>Your seats have been reserved.</p>
    <p id="purchaseDetails"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="js/seats.js"></script>
