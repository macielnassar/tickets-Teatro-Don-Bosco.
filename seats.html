<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seat Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2d3d;
    }

    header {
      background: #0b3c5d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    /* SEAT SHAPE */
    .seat {
      width: 32px;
      height: 26px;
      background: #000;
      border-radius: 6px 6px 4px 4px;
      position: relative;
      cursor: pointer;
    }

    .seat::before {
      content: "";
      position: absolute;
      top: -10px;
      left: 3px;
      width: 26px;
      height: 10px;
      background: #000;
      border-radius: 6px 6px 0 0;
    }

    .selected-adult {
      background: #0b3c5d;
    }

    .selected-adult::before {
      background: #0b3c5d;
    }

    .selected-child {
      background: #6baed6;
    }

    .selected-child::before {
      background: #6baed6;
    }

    .occupied {
      background: #555;
      cursor: not-allowed;
    }

    .occupied::before {
      background: #555;
    }

    .screen {
      background: #ccc;
      padding: 8px;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 4px;
      font-weight: bold;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 12px;
      justify-items: center;
      margin-bottom: 30px;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls button {
      margin: 0 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .adult-btn {
      background: #0b3c5d;
      color: white;
    }

    .child-btn {
      background: #6baed6;
      color: white;
    }

    .summary {
      text-align: center;
      font-size: 16px;
    }

    #confirm {
      display: block;
      margin: 25px auto;
      padding: 12px 30px;
      background: #0b3c5d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    /* MODAL */
    #confirmationModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #confirmationModal .modal-content {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }

    #closeModal {
      margin-top: 20px;
      padding: 10px 25px;
      background: #0b3c5d;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<header>
  <h1>Seat Selection</h1>
  <p>Select your seats and ticket type</p>
</header>

<main>

  <div class="legend">
    <span>Adult — $10</span>
    <span>Child — $6</span>
    <span>Gray = Occupied</span>
  </div>

  <div class="controls">
    <button class="adult-btn" id="adultMode">Adult Ticket</button>
    <button class="child-btn" id="childMode">Child Ticket</button>
  </div>

  <div class="screen">STAGE</div>

  <div class="seats" id="seats"></div>

  <div class="summary" id="summary">
    Selected seats: 0<br>
    Total: $0
  </div>

  <button id="confirm">Confirm Selection</button>

</main>

<!-- CONFIRMATION MODAL -->
<div id="confirmationModal">
  <div class="modal-content">
    <h2>Purchase Successful 🎉</h2>
    <p>Your seats have been successfully reserved.</p>
    <button id="closeModal">Close</button>
  </div>
</div>

<script>
  const seatsContainer = document.getElementById("seats");
  const summary = document.getElementById("summary");
  const confirmBtn = document.getElementById("confirm");
  const modal = document.getElementById("confirmationModal");
  const closeModal = document.getElementById("closeModal");

  const adultBtn = document.getElementById("adultMode");
  const childBtn = document.getElementById("childMode");

  let currentType = "adult";
  let selectedSeats = [];

  const prices = {
    adult: 10,
    child: 6
  };

  adultBtn.onclick = () => currentType = "adult";
  childBtn.onclick = () => currentType = "child";

  // CREATE SEATS
  for (let i = 1; i <= 60; i++) {
    const seat = document.createElement("div");
    seat.classList.add("seat");
    seat.dataset.id = i;

    // Random occupied seats
    if (Math.random() < 0.15) {
      seat.classList.add("occupied");
    }

    seat.onclick = () => {
      if (seat.classList.contains("occupied")) return;

      const index = selectedSeats.findIndex(s => s.id === i);

      if (index >= 0) {
        selectedSeats.splice(index, 1);
        seat.classList.remove("selected-adult", "selected-child");
      } else {
        selectedSeats.push({ id: i, type: currentType });
        seat.classList.add(
          currentType === "adult" ? "selected-adult" : "selected-child"
        );
      }

      updateSummary();
    };

    seatsContainer.appendChild(seat);
  }

  function updateSummary() {
    let total = 0;
    selectedSeats.forEach(s => total += prices[s.type]);

    summary.innerHTML = `
      Selected seats: ${selectedSeats.length}<br>
      Total: $${total}
    `;
  }

  confirmBtn.onclick = () => {
    if (selectedSeats.length === 0) return;
    modal.style.display = "flex";
  };

  closeModal.onclick = () => {
    modal.style.display = "none";
  };
</script>

</body>
</html>
