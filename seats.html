<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Seat Reservation</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    .seat {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
    }
    .adult {
      background-color: #bfdbfe;
      color: #1e3a8a;
    }
    .child {
      background-color: #fde68a;
      color: #92400e;
    }
    .occupied {
      background-color: #9ca3af;
      color: white;
      cursor: not-allowed;
    }
    .selected {
      outline: 3px solid #1e3a8a;
    }
  </style>
</head>

<body class="bg-slate-100 min-h-screen p-8">

  <div class="max-w-5xl mx-auto bg-white rounded-2xl shadow-xl p-10">
    <h1 class="text-4xl font-bold mb-4 text-center">
      Choose Your Seats
    </h1>
    <p class="text-center text-gray-500 mb-10">
      Select adult or child seats and view pricing in real time
    </p>

    <!-- STEP 1 -->
    <div class="mb-8">
      <label class="block font-semibold mb-2">
        Ticket Quantity
      </label>
      <input
        id="quantity"
        type="number"
        min="1"
        max="10"
        value="1"
        class="border rounded-lg px-4 py-2 w-32"
      />
    </div>

    <!-- BUY BUTTON -->
    <button
      id="buyBtn"
      class="bg-blue-700 text-white px-8 py-3 rounded-xl mb-10 hover:bg-blue-800 transition"
    >
      Buy Tickets
    </button>

    <!-- STEP 2 -->
    <div id="typeSection" class="hidden mb-10">
      <h2 class="text-2xl font-bold mb-4">
        Step 2: Select Seat Type
      </h2>

      <div class="flex gap-10">
        <label class="flex items-center gap-2 font-medium">
          <input type="radio" name="seatType" value="adult" checked />
          Adult ($10)
        </label>

        <label class="flex items-center gap-2 font-medium">
          <input type="radio" name="seatType" value="child" />
          Child ($6)
        </label>
      </div>
    </div>

    <!-- STEP 3 -->
    <div id="seatSection" class="hidden">
      <h2 class="text-2xl font-bold mb-6">
        Step 3: Seat Selection
      </h2>

      <!-- SCREEN -->
      <div class="text-center text-gray-400 mb-4 tracking-widest">
        SCREEN
      </div>

      <!-- SEAT MAP -->
      <div
        class="grid grid-cols-10 gap-4 justify-center mb-8"
        id="seatMap"
      ></div>

      <!-- SUMMARY -->
      <div class="grid grid-cols-3 gap-6 text-sm text-gray-700">
        <p>Adult seats: <span id="adultCount">0</span></p>
        <p>Child seats: <span id="childCount">0</span></p>
        <p class="font-semibold">
          Total price: $<span id="totalPrice">0</span>
        </p>
      </div>
    </div>
  </div>

  <script src="seats.js"></script>
</body>
</html>
