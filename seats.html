<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Select Your Seats</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    body {
      font-family: "Segoe UI", sans-serif;
      background: #111;
      color: #fff;
      margin: 0;
      padding: 0;
    }

    header {
      background: #000;
      padding: 20px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
      border-bottom: 1px solid #333;
    }

    main {
      max-width: 900px;
      margin: 30px auto;
      padding: 20px;
    }

    .screen {
      background: #444;
      height: 40px;
      margin: 20px 0 40px;
      border-radius: 5px;
      text-align: center;
      line-height: 40px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 12px;
      justify-items: center;
      margin-bottom: 30px;
    }

    .seat {
      width: 40px;
      height: 40px;
      background: #2ecc71;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .seat.selected {
      background: #f1c40f;
    }

    .seat.occupied {
      background: #555;
      cursor: not-allowed;
    }

    .legend {
      display: flex;
      gap: 20px;
      justify-content: center;
      margin-bottom: 30px;
    }

    .legend div {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .legend span {
      width: 18px;
      height: 18px;
      border-radius: 4px;
      display: inline-block;
    }

    .available { background: #2ecc71; }
    .selected-seat { background: #f1c40f; }
    .occupied-seat { background: #555; }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }

    select {
      padding: 8px;
      border-radius: 5px;
      border: none;
      font-size: 1rem;
    }

    .summary {
      font-size: 1.1rem;
    }

    button {
      background: #e74c3c;
      color: #fff;
      border: none;
      padding: 12px 20px;
      font-size: 1rem;
      border-radius: 6px;
      cursor: pointer;
    }

    button:hover {
      background: #c0392b;
    }
  </style>
</head>

<body>

<header>
  Seat Selection
</header>

<main>

  <div class="screen">SCREEN</div>

  <div class="seats" id="seats">
    <!-- Seats generated by JS -->
  </div>

  <div class="legend">
    <div><span class="available"></span> Available</div>
    <div><span class="selected-seat"></span> Selected</div>
    <div><span class="occupied-seat"></span> Occupied</div>
  </div>

  <div class="controls">
    <div>
      Ticket Type:
      <select id="ticketType">
        <option value="adult">Adult ($10)</option>
        <option value="child">Child ($6)</option>
      </select>
    </div>

    <div class="summary">
      Seats Selected: <span id="count">0</span> |
      Total: $<span id="total">0</span>
    </div>

    <button onclick="confirmSelection()">Confirm Selection</button>
  </div>

</main>

<script>
  const seatsContainer = document.getElementById("seats");
  const countEl = document.getElementById("count");
  const totalEl = document.getElementById("total");
  const ticketTypeEl = document.getElementById("ticketType");

  const prices = {
    adult: 10,
    child: 6
  };

  const totalSeats = 40;
  const occupiedSeats = [5, 12, 18, 26];

  function createSeats() {
    for (let i = 1; i <= totalSeats; i++) {
      const seat = document.createElement("div");
      seat.classList.add("seat");

      if (occupiedSeats.includes(i)) {
        seat.classList.add("occupied");
      }

      seat.addEventListener("click", () => {
        if (!seat.classList.contains("occupied")) {
          seat.classList.toggle("selected");
          updateSummary();
        }
      });

      seatsContainer.appendChild(seat);
    }
  }

  function updateSummary() {
    const selectedSeats = document.querySelectorAll(".seat.selected").length;
    const price = prices[ticketTypeEl.value];

    countEl.innerText = selectedSeats;
    totalEl.innerText = selectedSeats * price;
  }

  ticketTypeEl.addEventListener("change", updateSummary);

  function confirmSelection() {
    const selectedSeats = document.querySelectorAll(".seat.selected").length;

    if (selectedSeats === 0) {
      alert("Please select at least one seat.");
      return;
    }

    alert("Seats successfully selected!");
  }

  createSeats();
</script>

</body>
</html>
