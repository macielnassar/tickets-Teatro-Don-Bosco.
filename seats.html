<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Seat Selection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #1f2d3d;
    }

    header {
      background: #0b3c5d;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px;
    }

    .legend {
      display: flex;
      justify-content: center;
      gap: 25px;
      margin-bottom: 20px;
      font-size: 14px;
    }

    .seat {
      width: 34px;
      height: 34px;
      border-radius: 8px;
      cursor: pointer;
      background: #d9e6f2;
    }

    .selected-adult {
      background: #0b3c5d;
    }

    .selected-child {
      background: #6baed6;
    }

    .occupied {
      background: #aaa;
      cursor: not-allowed;
    }

    .screen {
      background: #ccc;
      padding: 8px;
      text-align: center;
      margin-bottom: 20px;
      border-radius: 4px;
      font-weight: bold;
    }

    .seats {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 10px;
      justify-items: center;
      margin-bottom: 30px;
    }

    .controls {
      text-align: center;
      margin-bottom: 20px;
    }

    .controls button {
      margin: 0 10px;
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .adult-btn {
      background: #0b3c5d;
      color: white;
    }

    .child-btn {
      background: #6baed6;
      color: white;
    }

    .summary {
      text-align: center;
      font-size: 16px;
    }

    #confirm {
      display: block;
      margin: 25px auto;
      padding: 12px 30px;
      background: #0b3c5d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    #confirmationModal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.6);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }

    #confirmationModal div {
      background: white;
      padding: 30px;
      border-radius: 12px;
      width: 320px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>Seat Selection</h1>
  <p>Select your seats and ticket type</p>
</header>

<main>

  <div class="legend">
    <span>Adult — $10</span>
    <span>Child — $6</span>
    <span>Gray = Occupied</span>
  </div>

  <div class="controls">
    <button class="adult-btn" id="adultMode">Adult Ticket</button>
    <button class="child-btn" id="childMode">Child Ticket</button>
  </div>

  <div class="screen">STAGE</div>

  <div class="seats" id="seats"></div>

  <div class="summary" id="summary">
    Selected seats: 0<br>
    Total: $0
  </div>

  <button id="confirm">Confirm Selection</button>

</main>

<div id="confirmationModal">
  <div>
    <h2>Purchase Successful 🎉</h2>
    <p>Your seats have been reserved.</p>
    <p id="purchaseDetails"></p>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script src="js/seats.js"></script>

</body>
</html>
