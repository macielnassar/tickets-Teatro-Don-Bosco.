<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-gradient-to-br from-blue-100 to-blue-300 min-h-screen">

<nav class="flex justify-between p-6 text-blue-900 items-center">
  <h1 class="text-2xl font-bold">🎭 Teatro Don Bosco</h1>

  <div class="flex gap-4 items-center">
    <span id="userEmail" class="text-sm"></span>
    <button onclick="logout()" class="bg-blue-900 text-white px-4 py-1 rounded">
      Salir
    </button>
  </div>
</nav>

<div class="text-center mt-24">
  <h1 class="text-5xl font-bold text-blue-900 mb-6">
    Reserve Your Seats 🎟️
  </h1>

  <a href="seats.html" class="bg-white px-8 py-4 rounded-2xl shadow-lg hover:scale-105 transition">
    Choose your seat
  </a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDJclflFy2DKoMM-7_yh0j-emyPa4RkALw",
    authDomain: "ticketsdonb.firebaseapp.com",
    projectId: "ticketsdonb",
    appId: "1:273721684602:web:993dd518cfee19056c01c3"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // 🔒 PROTEGER PÁGINA
  onAuthStateChanged(auth, (user) => {
    if (!user) {
      window.location.href = "login.html";
    } else {
      document.getElementById("userEmail").textContent = user.email;
    }
  });

  // 🚪 CERRAR SESIÓN
  window.logout = () => {
    signOut(auth).then(() => {
      window.location.href = "login.html";
    });
  };
</script>

</body>
</html>
</html>
