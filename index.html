<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Poppins', sans-serif; }
  </style>
</head>

<body class="bg-gradient-to-r from-blue-200 to-blue-400 min-h-screen flex items-center justify-center">

<!-- CONTENEDOR -->
<div class="bg-white p-10 rounded-2xl shadow-2xl w-96">

  <!-- TITULO -->
  <div class="text-center mb-6">
    <h1 class="text-2xl font-bold text-blue-900">🎭 Teatro Don Bosco</h1>
  </div>

  <!-- BOTONES CAMBIO -->
  <div class="flex mb-6">
    <button onclick="showLogin()" id="btnLogin"
      class="w-1/2 py-2 bg-blue-500 text-white rounded-l-lg">
      Iniciar sesión
    </button>

    <button onclick="showRegister()" id="btnRegister"
      class="w-1/2 py-2 bg-gray-300 rounded-r-lg">
      Crear cuenta
    </button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm">
    <input id="loginEmail" type="email" placeholder="Correo"
      class="w-full mb-3 p-3 border rounded-lg">

    <input id="loginPassword" type="password" placeholder="Contraseña"
      class="w-full mb-4 p-3 border rounded-lg">

    <button onclick="login()"
      class="w-full bg-blue-500 text-white py-3 rounded-lg hover:bg-blue-600">
      Iniciar sesión
    </button>
  </div>

  <!-- REGISTER -->
  <div id="registerForm" class="hidden">
    <input id="regEmail" type="email" placeholder="Correo"
      class="w-full mb-3 p-3 border rounded-lg">

    <input id="regPassword" type="password" placeholder="Contraseña"
      class="w-full mb-4 p-3 border rounded-lg">

    <button onclick="register()"
      class="w-full bg-green-500 text-white py-3 rounded-lg hover:bg-green-600">
      Crear cuenta
    </button>
  </div>

  <!-- ERROR -->
  <p id="error" class="text-red-500 text-sm mt-3 text-center hidden">
    Datos incorrectos o incompletos
  </p>

</div>

<script>

// CAMBIO DE FORMULARIOS
function showLogin() {
  document.getElementById("loginForm").classList.remove("hidden");
  document.getElementById("registerForm").classList.add("hidden");

  document.getElementById("btnLogin").classList.add("bg-blue-500","text-white");
  document.getElementById("btnRegister").classList.remove("bg-blue-500","text-white");
  document.getElementById("btnRegister").classList.add("bg-gray-300");
}

function showRegister() {
  document.getElementById("registerForm").classList.remove("hidden");
  document.getElementById("loginForm").classList.add("hidden");

  document.getElementById("btnRegister").classList.add("bg-blue-500","text-white");
  document.getElementById("btnLogin").classList.remove("bg-blue-500","text-white");
  document.getElementById("btnLogin").classList.add("bg-gray-300");
}

// REGISTRO
function register() {
  const email = document.getElementById("regEmail").value;
  const password = document.getElementById("regPassword").value;
  const error = document.getElementById("error");

  if (!email || !password) {
    error.classList.remove("hidden");
    return;
  }

  localStorage.setItem("registeredUser", JSON.stringify({ email, password }));

  alert("Cuenta creada correctamente");
  showLogin();
}

// LOGIN
function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;
  const error = document.getElementById("error");

  const savedUser = JSON.parse(localStorage.getItem("registeredUser"));

  if (!email || !password || !savedUser) {
    error.classList.remove("hidden");
    return;
  }

  if (email === savedUser.email && password === savedUser.password) {
    localStorage.setItem("user", JSON.stringify({ email }));

    // 👉 AQUÍ VA LA SIGUIENTE PÁGINA
    window.location.href = "home.html";
  } else {
    error.classList.remove("hidden");
  }
}
